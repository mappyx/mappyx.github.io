<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Technical Article - Rafael Paez">
    <meta name="author" content="Rafael Paez">
    <title>Technical Article - Rafael Paez</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="css/custom.css">
</head>

<body class="blueprint-theme">

    <div id="blueprint-canvas-container"></div>

    <nav class="bp-nav">
        <div class="bp-nav-container">
            <a href="index.html#home" class="bp-nav-logo">
                <span class="material-symbols-outlined">architecture</span>
                RAFAEL.PAEZ
            </a>
            <button class="bp-mobile-toggle" aria-label="Toggle Navigation">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <ul class="bp-nav-links">
                <li><a href="index.html#home"><span class="material-symbols-outlined">home</span>HOME</a></li>
                <li><a href="index.html#about"><span class="material-symbols-outlined">badge</span>PROFILE</a></li>
                <li><a href="index.html#projects"><span class="material-symbols-outlined">terminal</span>PROJECTS</a></li>
                <li><a href="index.html#skills"><span class="material-symbols-outlined">code</span>SKILLS</a></li>
                <li><a href="blog.html"><span class="material-symbols-outlined">article</span>BLOG</a></li>
                <li><a href="index.html#contact"><span class="material-symbols-outlined">mail</span>CONTACT</a></li>
            </ul>
        </div>
    </nav>

    <div class="bp-container" style="padding-top: 100px;">

        <div id="post-content" style="margin-top: 40px;">
            <div class="bp-loader">
                <span class="material-symbols-outlined bp-spin">sync</span>
                Loading document...
            </div>
        </div>

        <footer class="bp-footer">
            <p>© 2026 Rafael Paez // Architectural Blueprint Theme</p>
            <p style="margin-top: 8px;">
                <a href="blog.html">
                    <span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
                    Return to Index
                </a>
            </p>
        </footer>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/markdown-parser.js"></script>
    <script src="js/blog.js"></script>
    <script src="js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const slug = BlogSystem.getURLParam('slug');
            if (!slug) {
                document.getElementById('post-content').innerHTML =
                    '<div class="bp-card">' +
                    '<div class="bp-card-header"><span class="material-symbols-outlined">error</span> Error</div>' +
                    '<p style="color: var(--bp-white-muted);">No document specified in query parameter.</p>' +
                    '<div style="text-align: center; margin-top: 24px;">' +
                    '<a href="blog.html" class="bp-btn"><span class="material-symbols-outlined">arrow_back</span>Back to Index</a>' +
                    '</div>' +
                    '</div>';
                return;
            }

            const blog = new BlogSystem();
            blog.renderPost('post-content', slug);
        });
    </script>

</body>

</html>
